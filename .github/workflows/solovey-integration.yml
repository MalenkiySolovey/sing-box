name: Solovey integration

on:
  push:
    branches: [solovey/r7-shtorm-integration, solovey/r7-mieru-listeners]
    paths:
      - protocol/mieru/**
      - go.mod
      - go.sum
      - .github/workflows/solovey-integration.yml
  pull_request:
    branches: [solovey/r7-shtorm-integration]
    paths:
      - protocol/mieru/**
      - go.mod
      - go.sum
      - .github/workflows/solovey-integration.yml

permissions:
  contents: read

concurrency:
  group: solovey-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mieru-listeners:
    name: Mieru listener lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: 1.26.10
          cache: true
      - run: go test -race -mod=readonly ./protocol/mieru -run TestMieru -count=10
